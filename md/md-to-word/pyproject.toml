[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-word"
version = "0.1.0"
description = "Convert Markdown documents with images, links, tables, code, and Mermaid diagrams to Word DOCX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2,<2",
    "markdown-it-py>=3.0.0,<4",
    "Pillow>=10.0.0,<13",
    "PyYAML>=6.0,<7",
    "requests>=2.31.0,<3",
]

[project.scripts]
md-to-word = "md_to_word.main:main"

[tool.setuptools.packages.find]
where = ["src"]
